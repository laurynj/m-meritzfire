<!DOCTYPE html>
<html lang="ko">
<head>
    <title>메리츠화재 공식 사이트</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="author" content="메리츠화재">
    <meta name="description" content="메리츠화재 공식 모바일사이트입니다. 고객서비스 및 보험가입안내 제공. 암보험, 치매보험, 펫보험, 건강보험, 치아보험, 태아보험, 어린이보험, 운전자보험, 입원비보험, 수술비보험, 종합보험, 실비보험, 실손보험, 유병자보험, 주택화재보험, 골절보험 등. 인터넷고객센터를 이용한 계약조회, 보험금 청구, 보험계약 대출, 증명서 발급, 고객정보 변경, 보험료 납입, 전자민원 신청, 서비스망 찾기 등의 서비스를 만나보세요.">
    <meta name="keywords" content="메리츠화재, 메리츠화재, 운전자보험, 암보험, 태아보험, 어린이보험, 실비보험, 실손보험, 유병자보험, 주택화재보험, 골절보험, 치매보험, 펫보험, 시니어보험, 간편보험, 입원비보험, 수술비보험, 종합보험, 건강보험, 자동차보험, 다이렉트자동차보험, 다이렉트 해외여행보험, 채팅상담, 보험료계산, 보험가입 상담신청">

    <!-- favicon -->
    <link rel="shortcut icon" href="../../common/images/meritz_favicon.ico">
    <link rel="apple-touch-icon" href="../../common/images/meritz_favicon.png">

    <!-- css link -->
    <link rel="stylesheet" href="../../default/css/renewal/base.css">

    <!-- script -->
    <script src="../../common/js/jquery/jquery.min.js"></script>
    <script src="../../common/js/ui_renewal/swiper-bundle.min.js"></script>
    <script src="../../common/js/ui_renewal/ui.js"></script>

    <!-- swiper css -->
    <link rel="stylesheet" href="../../common/js/ui_renewal/swiper-bundle.min.css">
</head>
<body class="renew">
    <div class="skipnav"><a href="#Container">본문 바로가기</a></div>
    <!-- Wrap [s] -->
    <div id="Wrap">
        <!-- header [s] -->
        <header id="Header">
            <div class="header_wrap">
                <div class="btns_left"><button type="button" class="btn_prev"><span>이전</span></button></div>
                <h1>필수 약관 동의</h1>
                <div class="btns_right"><button type="button" class="btn_menu"><span>메뉴</span></button></div>
            </div>
        </header>
        <!-- // header [e] -->

        <!-- main container [s] -->
        <main id="Container">
            <section class="contents">
                <h2 class="m_tit">필수 약관 동의</h2>
                <button type="button" class="pop_btn_ok" onclick="renewalUI.openPopup('claimAgree');"><span>openPopup</span></button>
            </section>
        </main>
        <!-- // main container [e] -->
    </div>
    <!-- // Wrap [e] -->

    <!-- popup area [s] -->
    <div id="layer_popup_container">
        <div id="claimAgree">
            <!-- popup publishing [s] -->
            <div class="dimmed_area"><!-- popup open시 class값 'on' 추가 -->
                <!--
                    popup 형태에 따른 class 값
                    1. 일반 팝업: 없음
                    2. alert 팝업: alert
                    3. confirm 팝업: confirm
                    4. 전체 팝업: full
                    5. floating 팝업: floating
                -->
                <div class="popup floating"><!-- popup open시 class값 'open' 추가 -->
                    <!-- popup header [s] -->
                    <div class="pop_header">
                        <h1>아래 필수약관에<br><strong>동의</strong>해주세요</h1>
                        <button type="button" class="pop_close"><span class="hidden">닫기</span></button>
                    </div>
                    <!-- // popup header [e] -->

                    <!-- popup body [s] -->
                    <div class="pop_body">
                        <ul class="check_list claim_agree">
                            <li>
                                <div class="check_item">
                                    <input type="checkbox" id="collectAll" class="agree_all" name="collectAgreeAll">
                                    <label for="collectAll"><span>[필수]개인(신용)정보 수집ㆍ이용에 관한 사항</span></label>
                                    <button type="button" class="more more_dark align_first"><span class="hidden">[필수]개인(신용)정보 수집ㆍ이용에 관한 사항 자세히 보기</span></button>
                                </div>
                                <ul class="claim_agree_sub">
                                    <li class="check_item">
                                        <input type="checkbox" id="collect1" name="collectAgree" value="1">
                                        <label for="collect1"><span>고유식별정보</span></label>
                                    </li>
                                    <li class="check_item">
                                        <input type="checkbox" id="collect2" name="collectAgree" value="2">
                                        <label for="collect2"><span>민감정보</span></label>
                                    </li>
                                    <li class="check_item">
                                        <input type="checkbox" id="collect3" name="collectAgree" value="3">
                                        <label for="collect3"><span>개인(신용)정보</span></label>
                                    </li>
                                </ul>
                            </li>
                            <li>
                                <div class="check_item">
                                    <input type="checkbox" id="provideAll" class="agree_all" name="provideAgreeAll">
                                    <label for="provideAll"><span>[필수]개인(신용)정보 제공에 관한 동의</span></label>
                                    <button type="button" class="more more_dark align_first"><span class="hidden">[필수]개인(신용)정보 제공에 관한 동의 자세히 보기</span></button>
                                </div>
                                <ul class="claim_agree_sub">
                                    <li class="check_item">
                                        <input type="checkbox" id="provide1" name="provideAgree" value="1">
                                        <label for="provide1"><span>고유식별정보</span></label>
                                    </li>
                                    <li class="check_item">
                                        <input type="checkbox" id="provide2" name="provideAgree" value="2">
                                        <label for="provide2"><span>민감정보</span></label>
                                    </li>
                                    <li class="check_item">
                                        <input type="checkbox" id="provide3" name="provideAgree" value="3">
                                        <label for="provide3"><span>국내 개인(신용)<br>정보</span></label>
                                    </li>
                                    <li class="check_item">
                                        <input type="checkbox" id="provide4" name="provideAgree" value="4">
                                        <label for="provide4"><span>국외 개인(신용)<br>정보</span></label>
                                    </li>
                                </ul>
                            </li>
                            <li>
                                <div class="check_item">
                                    <input type="checkbox" id="inquiryAll" class="agree_all" name="inquiryAgreeAll">
                                    <label for="inquiryAll"><span>[필수]개인(신용)정보 조회에 관한 동의</span></label>
                                    <button type="button" class="more more_dark align_first"><span class="hidden">[필수]개인(신용)정보 조회에 관한 동의 자세히 보기</span></button>
                                </div>
                                <ul class="claim_agree_sub">
                                    <li class="check_item">
                                        <input type="checkbox" id="inquiry1" name="inquiryAgree" value="1">
                                        <label for="inquiry1"><span>고유식별정보</span></label>
                                    </li>
                                    <li class="check_item">
                                        <input type="checkbox" id="inquiry2" name="inquiryAgree" value="2">
                                        <label for="inquiry2"><span>민감정보</span></label>
                                    </li>
                                    <li class="check_item">
                                        <input type="checkbox" id="inquiry3" name="inquiryAgree" value="3">
                                        <label for="inquiry3"><span>개인(신용)정보</span></label>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                    <!-- // popup body [e] -->
                    <div class="pop_bottom">
                        <div class="inner">
                            <button type="button" class="pop_btn_ok" disabled><span>전체 동의 및 확인</span></button>
                        </div>
                    </div>
                </div>
                <div class="dimmed"></div>
            </div>
            <!-- popup publishing [e] -->
        </div>
    </div>
    <!-- popup area [e] -->

    <!-- 퍼블리싱 UI 확인을 위한 script로 개발 시 참고만 해 주세요. -->
    <script type="text/javascript">
        $(function () {
            var $agree = $('.claim_agree');
            var $confirm = $agree.closest('.popup').find('.pop_bottom .pop_btn_ok');

            // 전체 체크 시 확인 버튼 활성화
            function updateConfirm() {
                var $items = $agree.find('.claim_agree_sub input');
                $confirm.prop('disabled', !$items.length || $items.filter(':checked').length !== $items.length);
            }

            // 그룹별 전체·개별 체크 연동
            $agree.on('change', 'input[type="checkbox"]', function () {
                var $group = $(this).closest('.claim_agree > li');
                var $all = $group.find('.agree_all');
                var $items = $group.find('.claim_agree_sub input');

                if ($(this).hasClass('agree_all')) {
                    $items.prop('checked', this.checked);
                } else {
                    $all.prop('checked', $items.filter(':checked').length === $items.length);
                }
                updateConfirm();
            });

            // 확인 후 팝업 닫기
            $confirm.on('click', function () {
                renewalUI.closePopup('claimAgree');
            });

            // 초기 상태 설정 및 팝업 열기
            updateConfirm();
            renewalUI.openPopup('claimAgree');
        });
    </script>
</body>
</html>

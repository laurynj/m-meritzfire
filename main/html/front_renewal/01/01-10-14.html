<!DOCTYPE html>
<html lang="ko">
<head>
    <title>메리츠화재 공식 사이트</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="author" content="메리츠화재">
    <meta name="description" content="메리츠화재 공식 모바일사이트입니다. 고객서비스 및 보험가입안내 제공. 암보험, 치매보험, 펫보험, 건강보험, 치아보험, 태아보험, 어린이보험, 운전자보험, 입원비보험, 수술비보험, 종합보험, 실비보험, 실손보험, 유병자보험, 주택화재보험, 골절보험 등. 인터넷고객센터를 이용한 계약조회, 보험금 청구, 보험계약 대출, 증명서 발급, 고객정보 변경, 보험료 납입, 전자민원 신청, 서비스망 찾기 등의 서비스를 만나보세요.">
    <meta name="keywords" content="메리츠화재, 메리츠화재, 운전자보험, 암보험, 태아보험, 어린이보험, 실비보험, 실손보험, 유병자보험, 주택화재보험, 골절보험, 치매보험, 펫보험, 시니어보험, 간편보험, 입원비보험, 수술비보험, 종합보험, 건강보험, 자동차보험, 다이렉트자동차보험, 다이렉트 해외여행보험, 채팅상담, 보험료계산, 보험가입 상담신청">

    <!-- favicon -->
    <link rel="shortcut icon" href="../../common/images/meritz_favicon.ico">
    <link rel="apple-touch-icon" href="../../common/images/meritz_favicon.png">

    <!-- css link -->
    <link rel="stylesheet" href="../../default/css/renewal/base.css">

    <!-- script -->
    <script src="../../common/js/jquery/jquery.min.js"></script>
    <script src="../../common/js/ui_renewal/swiper-bundle.min.js"></script>
    <script src="../../common/js/ui_renewal/ui.js"></script>

    <!-- swiper css -->
    <link rel="stylesheet" href="../../common/js/ui_renewal/swiper-bundle.min.css">
</head>
<body class="renew">
    <div class="skipnav"><a href="#Container">본문 바로가기</a></div>
    <!-- Wrap [s] -->
    <div id="Wrap">
        <!-- header [s] -->
        <header id="Header">
            <div class="header_wrap">
                <div class="btns_left">
                    <button type="button" class="btn_prev"><span>이전</span></button>
                </div>
                <h1>사고장소</h1>
                <div class="btns_right">
                    <button type="button" class="btn_menu"><span>메뉴</span></button>
                </div>
            </div>
        </header>
        <!-- // header [e] -->

        <!-- main container [s] -->
        <main id="Container">
            <!-- container [s] -->
            <section class="contents">
                <div class="greeting_wrap">
                    <h2 class="greeting_tit">
                        <strong>사고 장소</strong>를<br>선택해 주세요.
                    </h2>
                    <!-- <span class="step" aria-label="전체 12단계 중 4단계">04/12</span> -->
                    <span class="step" data-step="4"></span>
                </div>

                <ul class="choice_list line no_last">
                    <li><button type="button"><span class="tit">연립주택</span></button></li>
                    <li><button type="button"><span class="tit">아파트</span></button></li>
                    <li><button type="button"><span class="tit">주차장</span></button></li>
                    <li><button type="button"><span class="tit">스쿨존</span></button></li>
                    <li><button type="button"><span class="tit">고속도로</span></button></li>
                    <li><button type="button"><span class="tit">기타도로</span></button></li>
                    <li>
                        <button type="button"><span class="tit">기타(직접입력)</span></button>
                        <!-- 사고장소 입력 -->
                        <div class="form_item textbox normal hide"><!-- 기타 선택 시 노출 .hide 삭제 -->
                            <div class="inp_box">
                                <textarea name="" maxlength="1000" placeholder="사고장소를 입력해 주세요." onkeyup="counter(this)"></textarea>
                                <span class="counter light"><em id="countTxt">0</em> / 1000자</span>
                            </div>
                        </div>
                    </li>
                </ul>

                <!-- floating bottom [s] -->
                <div class="floating_btm hide"><!-- 기타 선택 시 노출 .hide 삭제 -->
                    <div class="floating_inner">
                        <button type="button" class="btn_ok" disabled><span>다음</span></button>
                    </div>
                </div>
                <!-- // floating bottom [e] -->
            </section>
            <!-- container [e] -->
        </main>
        <!-- // main container [e] -->
    </div>
    <!-- // Wrap [e] -->

    <!-- popup area [s] -->
    <div id="layer_popup_container"></div>
    <!-- popup area [e] -->

    <!-- 퍼블리싱 UI 확인을 위한 script로 개발 시 참고만 해 주세요 -->
    <script type="text/javascript">
        $(function () {
            var $etc = $('.choice_list > li:last-child'),
                $input = $etc.find('.form_item'),
                $text = $etc.find('textarea'),
                $bottom = $('.floating_btm');

            // 기타 선택 시 입력영역과 버튼 노출
            $('.choice_list > li > button').on('click', function () {
                var isEtc = $(this).parent().is($etc);
                $input.add($bottom).toggleClass('hide', !isEtc);
                if (!isEtc) counter($text.val('')[0]);
            });
        });

        // onkeyup 글자 수
        function counter(text,length) {
            document.getElementById('countTxt').innerHTML=text.value.length;
        }
    </script>
</body>
</html>

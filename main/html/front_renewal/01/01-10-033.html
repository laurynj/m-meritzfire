<!DOCTYPE html>
<html lang="ko">
<head>
    <title>메리츠화재 공식 사이트</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="author" content="메리츠화재">
    <meta name="description" content="메리츠화재 공식 모바일사이트입니다. 고객서비스 및 보험가입안내 제공. 암보험, 치매보험, 펫보험, 건강보험, 치아보험, 태아보험, 어린이보험, 운전자보험, 입원비보험, 수술비보험, 종합보험, 실비보험, 실손보험, 유병자보험, 주택화재보험, 골절보험 등. 인터넷고객센터를 이용한 계약조회, 보험금 청구, 보험계약 대출, 증명서 발급, 고객정보 변경, 보험료 납입, 전자민원 신청, 서비스망 찾기 등의 서비스를 만나보세요.">
    <meta name="keywords" content="메리츠화재, 메리츠화재, 운전자보험, 암보험, 태아보험, 어린이보험, 실비보험, 실손보험, 유병자보험, 주택화재보험, 골절보험, 치매보험, 펫보험, 시니어보험, 간편보험, 입원비보험, 수술비보험, 종합보험, 건강보험, 자동차보험, 다이렉트자동차보험, 다이렉트 해외여행보험, 채팅상담, 보험료계산, 보험가입 상담신청">

    <!-- favicon -->
    <link rel="shortcut icon" href="../../common/images/meritz_favicon.ico">
    <link rel="apple-touch-icon" href="../../common/images/meritz_favicon.png">

    <!-- css link -->
    <link rel="stylesheet" href="../../default/css/renewal/base.css">

    <!-- script -->
    <script src="../../common/js/jquery/jquery.min.js"></script>
    <script src="../../common/js/ui_renewal/swiper-bundle.min.js"></script>
    <script src="../../common/js/ui_renewal/ui.js"></script>

    <!-- swiper css -->
    <link rel="stylesheet" href="../../common/js/ui_renewal/swiper-bundle.min.css">
</head>
<body class="renew">
    <div class="skipnav"><a href="#Container">본문 바로가기</a></div>
    <!-- Wrap [s] -->
    <div id="Wrap">
        <!-- header [s] -->
        <header id="Header">
            <div class="header_wrap">
                <div class="btns_left"><button type="button" class="btn_prev"><span>이전</span></button></div>
                <h1>치료받은 분 선택</h1>
                <div class="btns_right"><button type="button" class="btn_menu"><span>메뉴</span></button></div>
            </div>
        </header>
        <!-- // header [e] -->

        <!-- main container [s] -->
        <main id="Container">
            <!-- container [s] -->
            <section class="contents">
                <h2 class="m_tit">치료받은 분 선택</h2>
                <button type="button" class="pop_btn_ok" onclick="renewalUI.openPopup('patientSelect');"><span>openPopup</span></button>
            </section>
            <!-- container [e] -->
        </main>
        <!-- // main container [e] -->
    </div>
    <!-- // Wrap [e] -->

    <!-- popup area [s] -->
    <div id="layer_popup_container">
        <div id="patientSelect">
            <!-- popup publishing [s] -->
            <div class="dimmed_area"><!-- popup open시 class값 'on' 추가 -->
                <!--
                    popup 형태에 따른 class 값
                    1. 일반 팝업: 없음
                    2. alert 팝업: alert
                    3. confirm 팝업: confirm
                    4. 전체 팝업: full
                    5. floating 팝업: floating
                -->
                <div class="popup full"><!-- popup open시 class값 'open' 추가 -->
                    <!-- popup header [s] -->
                    <div class="pop_header">
                        <h1></h1>
                        <button type="button" class="pop_close"><span class="hidden">닫기</span></button>
                    </div>
                    <!-- // popup header [e] -->

                    <!-- popup body [s] -->
                    <div class="pop_body">
                        <div class="greeting_wrap">
                            <h2 class="greeting_tit"><strong>치료받은 분</strong>을<br>선택해 주세요.</h2>
                        </div>
                        
                        <!-- 실손24 연계병원 : 비노출 .hide-->
                        <button type="button" class="guide_box hospital arr mb16">
                            <span class="guide_cont">
                                <span class="guide_tit">실손24 연계병원 확인하기</span>
                                <span class="guide_txt">서류 제출 없이 보험금을 청구할 수 있는<br>연계병원을 확인해 보세요.</span>
                                <span class="guide_note">오류 발생 시 <strong>1811-3000</strong> 문의</span>
                            </span>
                        </button>

                        <!-- 선택버튼 -->
                        <ul class="choice_list line no_last">
                            <li><button type="button"><span class="tit">본인</span></button></li>
                            <li><button type="button"><span class="tit">자녀</span></button></li>
                        </ul>

                    </div>
                    <!-- // popup body [e] -->

                    <!-- popup footer [s] -->
                    <!-- // popup footer [e] -->
                </div>

                <div class="dimmed"></div>
            </div>
            <!-- popup publishing [e] -->
        </div>
    </div>
    <!-- popup area [e] -->

    <!-- 퍼블리싱 UI 확인을 위한 script로 개발 시 참고만 해 주세요. -->
    <script type="text/javascript">
        $(function () {
            var isDirectClaim = new URLSearchParams(location.search).get('type') === 'direct';
            $('#patientSelect .guide_box.hospital').toggleClass('hide', isDirectClaim);
            renewalUI.openPopup('patientSelect');
        });
    </script>
</body>
</html>

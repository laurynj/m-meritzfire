<!DOCTYPE html>
<html lang="ko">
<head>
    <title>메리츠화재 공식 사이트</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="author" content="메리츠화재">
    <meta name="description" content="메리츠화재 공식 모바일사이트입니다. 고객서비스 및 보험가입안내 제공. 암보험, 치매보험, 펫보험, 건강보험, 치아보험, 태아보험, 어린이보험, 운전자보험, 입원비보험, 수술비보험, 종합보험, 실비보험, 실손보험, 유병자보험, 주택화재보험, 골절보험 등. 인터넷고객센터를 이용한 계약조회, 보험금 청구, 보험계약 대출, 증명서 발급, 고객정보 변경, 보험료 납입, 전자민원 신청, 서비스망 찾기 등의 서비스를 만나보세요.">
    <meta name="keywords" content="메리츠화재, 메리츠화재, 운전자보험, 암보험, 태아보험, 어린이보험, 실비보험, 실손보험, 유병자보험, 주택화재보험, 골절보험, 치매보험, 펫보험, 시니어보험, 간편보험, 입원비보험, 수술비보험, 종합보험, 건강보험, 자동차보험, 다이렉트자동차보험, 다이렉트 해외여행보험, 채팅상담, 보험료계산, 보험가입 상담신청">

    <!-- favicon -->
    <link rel="shortcut icon" href="../../common/images/meritz_favicon.ico">
    <link rel="apple-touch-icon" href="../../common/images/meritz_favicon.png">

    <!-- css link -->
    <link rel="stylesheet" href="../../default/css/renewal/base.css">

    <!-- script -->
    <script src="../../common/js/jquery/jquery.min.js"></script>
    <script src="../../common/js/ui_renewal/swiper-bundle.min.js"></script>
    <script src="../../common/js/ui_renewal/ui.js"></script>

    <!-- swiper css -->
    <link rel="stylesheet" href="../../common/js/ui_renewal/swiper-bundle.min.css">
</head>
<body class="renew">
    <div class="skipnav"><a href="#Container">본문 바로가기</a></div>
    <!-- Wrap [s] -->
    <div id="Wrap">
        <!-- header [s] -->
        <header id="Header">
            <div class="header_wrap">
                <div class="btns_left"><button type="button" class="btn_prev"><span>이전</span></button></div>
                <h1>청구 전 확인사항</h1>
                <div class="btns_right"><button type="button" class="btn_menu"><span>메뉴</span></button></div>
            </div>
        </header>
        <!-- // header [e] -->

        <!-- main container [s] -->
        <main id="Container">
            <!-- container [s] -->
            <section class="contents">
                <div class="greeting_wrap">
                    <h2 class="greeting_tit">청구 전 <strong>확인</strong>해 주세요.</h2>
                </div>

                <!-- 토스트 알림 : 비노출 .hide -->
                <div class="claim_toast">
                    <div class="txt_group">
                        <span class="tit"><strong>서류보완</strong>이 필요해요.</span>
                        <span>보완할 서류를 확인하고<br>제출해 주세요.</span>
                    </div>
                    <button type="button" class="view"><span>서류 보완하기</span></button>
                    <button type="button" class="close"><span class="hidden">닫기</span></button>
                </div>

                <!-- 실손24 : 비노출 .hide -->
                <h3 class="sss_tit"><strong>다른 방법으로 간편</strong>하게 청구할 수 있어요!</h3>
                <ul class="claim_method">
                    <li>
                        <div class="silson compact">
                            <span class="tit">실손24 간편청구</span>
                            <span>서류 발급 없이 바로 청구</span>
                            <button type="button" class="method_btn"><span>간편청구</span></button>
                        </div>
                    </li>
                </ul>

                <!-- Quick link: 비노출 .hide -->
                <ul class="claim_quick">
                    <li>
                        <button type="button" class="docs">
                            <div class="txt_group">
                                <span class="tit">맞춤서류 안내</span>
                                <span>상황에 맞는 필요서류를<br>확인해 보세요.</span>
                            </div>
                        </button>
                    </li>
                    <li>
                        <button type="button" class="status">
                            <div class="txt_group">
                                <span class="tit">청구현황/추가접수</span>
                                <span>청구 진행상황을 확인하고,<br>추가 접수할 수 있어요.</span>
                            </div>
                        </button>
                    </li>
                </ul>

                <!-- 안내 : 노출 .hide 삭제 -->
                <div class="guide_box claim complete damage hide">
                    <span class="guide_txt">타인 피해 청구와 재산 피해 청구는<br><span class="fc_red">서류 없이도 청구가 가능</span>해요.</span>
                </div>
                <!-- Quick link : 노출 .hide 삭제 -->
                <ul class="claim_quick damage hide">
                    <li>
                        <button type="button" class="reqdocs">
                            <div class="txt_group">
                                <span class="tit">필요서류 안내</span>
                                <span> 청구에 필요한 서류와<br>준비방법을 확인해 보세요.</span>
                            </div>
                        </button>
                    </li>
                    <li>
                        <button type="button" class="status">
                            <div class="txt_group">
                                <span class="tit">청구현황/추가접수</span>
                                <span>청구 진행상황을 확인하고,<br>추가 접수할 수 있어요.</span>
                            </div>
                        </button>
                    </li>
                </ul>

                <div class="link_list_box arr claim_links">
                    <ul>
                        <li><button type="button" class="btn_senior_link02"><span>보험금청구 유의사항 및 기타 안내사항</span></button></li>
                        <li><button type="button" class="btn_senior_link02"><span>보험금청구 동영상 가이드</span></button></li>
                    </ul>
                </div>

                <!-- floating bottom [s] -->
                <div class="floating_btm">
                    <div class="floating_inner">
                        <button type="button" class="btn_ok"><span>새로운 보험금 청구</span></button>
                    </div>
                </div>
                <!-- // floating bottom [e] -->
            </section>
            <!-- container [e] -->
        </main>
        <!-- // main container [e] -->
    </div>
    <!-- // Wrap [e] -->

    <!-- popup area [s] -->
    <div id="layer_popup_container"></div>
    <!-- popup area [e] -->

    <!-- 퍼블리싱 UI 확인을 위한 script로 개발 시 참고만 해 주세요 -->
    <script type="text/javascript">
        // 타인/재산 피해 청구: 01-10-02.html?type=damage
        var isDamageClaim = new URLSearchParams(location.search).get('type') === 'damage';
        $('.claim_toast, .claim_method, .sss_tit').toggleClass('hide', isDamageClaim);
        $('.guide_box.claim').toggleClass('hide', !isDamageClaim);
        $('.claim_quick:not(.damage)').toggleClass('hide', isDamageClaim);
        $('.claim_quick.damage').toggleClass('hide', !isDamageClaim);

        // 토스트 닫기
        $('.claim_toast .close').on('click', function () {
            $(this).closest('.claim_toast')
                .stop(true, true)
                .css('min-height', 0)
                .fadeTo(200, 0)
                .slideUp(250, function () {
                    $(this).remove();
                });
        });
    </script>
</body>
</html>

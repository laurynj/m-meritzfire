<!DOCTYPE html>
<html lang="ko">
<head>
    <title>메리츠화재 공식 사이트</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="author" content="메리츠화재">
    <meta name="description" content="메리츠화재 공식 모바일사이트입니다. 고객서비스 및 보험가입안내 제공. 암보험, 치매보험, 펫보험, 건강보험, 치아보험, 태아보험, 어린이보험, 운전자보험, 입원비보험, 수술비보험, 종합보험, 실비보험, 실손보험, 유병자보험, 주택화재보험, 골절보험 등. 인터넷고객센터를 이용한 계약조회, 보험금 청구, 보험계약 대출, 증명서 발급, 고객정보 변경, 보험료 납입, 전자민원 신청, 서비스망 찾기 등의 서비스를 만나보세요.">
    <meta name="keywords" content="메리츠화재, 메리츠화재, 운전자보험, 암보험, 태아보험, 어린이보험, 실비보험, 실손보험, 유병자보험, 주택화재보험, 골절보험, 치매보험, 펫보험, 시니어보험, 간편보험, 입원비보험, 수술비보험, 종합보험, 건강보험, 자동차보험, 다이렉트자동차보험, 다이렉트 해외여행보험, 채팅상담, 보험료계산, 보험가입 상담신청">

    <!-- favicon -->
    <link rel="shortcut icon" href="../../common/images/meritz_favicon.ico">
    <link rel="apple-touch-icon" href="../../common/images/meritz_favicon.png">

    <!-- css link -->
    <link rel="stylesheet" href="../../default/css/renewal/base.css">

    <!-- script -->
    <script src="../../common/js/jquery/jquery.min.js"></script>
    <script src="../../common/js/ui_renewal/swiper-bundle.min.js"></script>
    <script src="../../common/js/ui_renewal/ui.js"></script>

    <!-- swiper css -->
    <link rel="stylesheet" href="../../common/js/ui_renewal/swiper-bundle.min.css">
</head>
<body class="renew">
	<div class="skipnav"><a href="#container">본문 바로가기</a></div>
	<!-- Wrap [s] -->
	<div id="Wrap">

        <!-- header [s] -->
		<header id="Header">
            <div class="header_wrap">
                <div class="btns_left">
                    <button type="button" class="btn_prev"><span>이전</span></button>
                </div>
                <h1>금융소비자 보호체계</h1>
                <div class="btns_right">
                    <button type="button" class="btn_menu"><span>메뉴</span></button>
                </div>
            </div>
        </header>
        <!-- // header [e] -->

        <!-- main container [s] -->
		<main id="Container">
			<!-- container [s] -->
			<section class="contents">
                <div class="greeting_wrap">
                    <h2 class="greeting_tit">
                        고객님 입장에서 <strong>소비자 권익 보호</strong>에 최선을 다하겠습니다.
                    </h2>
                </div>

                <div class="large_btns">
                    <button type="button" class="btn_large"><span>소비자보호헌장</span></button>
                    <button type="button" class="btn_large"><span>소비자보호조직도</span></button>
                    <button type="button" class="btn_large"><span>민원처리 프로세스</span></button>
                    <button type="button" class="btn_large"><span>상품개발 준칙</span></button>
                    <button type="button" class="btn_large"><span>상품개발 프로세스</span></button>
                    <button type="button" class="btn_large"><span>상품판매 준칙</span></button>
                </div>
            </section>
            <!-- container [e] -->
	</main>
        <!-- // main container [e] -->
	</div>
	<!-- // Wrap [e] -->


	<!-- popup area [s] -->
	<div id="layer_popup_container">
        <!-- layer  -->
        <div id="layer_confirm"><div class="dimmed_area">
            <div class="popup confirm" tabindex="0">
                <div class="pop_body">
                    <p class="info_txt ng-binding warning">종료하시겠습니까?</p>
                    <!-- ngIf: option.subMsg -->
                </div>
                <div class="pop_bottom">
                    <div class="inner">
                        <button type="button" class="pop_btn_gray"><span>취소</span></button>
                        <button type="button" class="pop_btn_ok"><span>확인</span></button>
                    </div>
                </div>
            </div>	
            <div class="dimmed"></div>
        </div>
    </div>
</div>

    <!-- popup area [e] -->

</body>
</html>
